# Pre-commit hook configuration for formatting, linting, and code-index updates before commits.
#
# code-index:begin
# {
#  "purpose": "Pre-commit hook configuration for formatting, linting, and code-index updates before commits.",
#  "read_when": "When adding or changing pre-commit hooks, excluded paths, or commit-stage tooling.",
#  "gotchas": [],
#  "keywords": ["pre-commit", "hooks", "lint", "format", "exclude", "repos", "commit", "code index"],
#  "format": 1
# }
# code-index:end

exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "nce_sync.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nce_sync/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nce_sync/templates/includes/.*|
                nce_sync/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nce_sync/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nce_sync/templates/includes/.*|
                nce_sync/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
